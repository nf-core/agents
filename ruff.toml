# Same rules as nf-core/tools (pyproject.toml), except the target version:
# skill scripts run with the system python3, which can be 3.9 (macOS).
line-length = 120
target-version = "py39"

[lint]
select = [
    "I",                     # isort
    "E1", "E4", "E7", "E9","E902",  # pycodestyle errors (partial)
    "F",                     # pyflakes
    "UP",                    # pyupgrade
    "N",                     # pep8-naming
    "B",                     # flake8-bugbear
    "RSE",                   # flake8-raise
    "PTH",                   # flake8-use-pathlib
    "SIM",                   # flake8-simplify
    "C4",                    # flake8-comprehensions
    "BLE",                   # flake8-blind-except
    "W",                     # pycodestyle warnings
    "A",                     # flake8-builtins
    "PIE",                   # flake8-pie
]
ignore = ["PTH123", "PIE790"]
